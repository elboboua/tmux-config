# UI settings
set-option -sa terminal-overrides ",xterm*:Tc"

set -g mouse on
set -g status-left-length 30
setw -g mode-keys vi
set -g history-limit 102400
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# Keep a pane open when its command fails. Orchestrator setup scripts run in a
# detached window and abort on the first error; without this the window closes
# and the error goes with it.
set-option -g remain-on-exit failed
set-hook -g pane-died 'select-window -t "#{window_id}"'

# name windows after the current program (shell, nvim, etc.) instead of
# letting the shell set the title to the hostname
set-window-option -g automatic-rename on
set-window-option -g automatic-rename-format '#{pane_current_command}'
set-option -g allow-rename off

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind-key g command-prompt -p "switch to session:" "switch-client -t '%%'"

# orchestrator: prefix+o jumps to the agent workspace view, starting it if needed
# Single-quoted so tmux leaves the expansion to /bin/sh; tmux expands ${VAR} in
# double-quoted strings itself and rejects the :- default form.
bind-key o run-shell '"${CODE_REPOS:-$HOME/Documents/github}"/plate/tui-orchestrator/bin/orch --ensure' \; switch-client -t orch
# prefix+m toggles an 80-column OpenCode pane on the right
bind-key m run-shell -b '"${CODE_REPOS:-$HOME/Documents/github}"/plate/tui-orchestrator/bin/orch-opencode-pane "#{pane_id}"'

bind-key < swap-window -t -1 \; select-window -t -1
bind-key > swap-window -t +1 \; select-window -t +1

set -g allow-passthrough on
set -g set-clipboard external

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-boot-options 'iterm'
set -g @plugin 'catppuccin/tmux'
# Configure the catppuccin plugin
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_status_style "rounded"
# show the window name (program) on tabs; this catppuccin version uses
# @catppuccin_window_text for inactive tabs (defaults to #T = hostname)
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_status "icon"
set -g @catppuccin_window_current_background "#{@thm_mauve}"
set -g @catppuccin_status_right_separator ""
set -g status-left "#{E:@catppuccin_status_session}#[default] "
set -g status-right "#{E:@catppuccin_status_directory}"
set -agF status-right "#{@catppuccin_status_gitmux}"

# update status every 2 seconds
set -g status-interval 2

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# Bootstrap: git clone https://github.com/tmux-plugins/tpm.git ~/.config/tmux/plugins/tpm
run '~/.config/tmux/plugins/tpm/tpm'
